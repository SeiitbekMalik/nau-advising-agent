[project]
name = "nau-advising-agent"
version = "0.1.0"
description = "NAU Student Advising & Help-Desk Agent (capstone prototype)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Vercel: the FastAPI instance named `app` in app/main.py serves every path.
[tool.vercel]
entrypoint = "app.main:app"
